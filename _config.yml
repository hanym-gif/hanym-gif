# Site settings
locale                   : "en-US"
title                    : "Yanmiao Han"
title_separator          : "-"
name                     : &name "Yanmiao Han"
description              : &description "PhD student working on condensed-matter theory, AI for materials, and quantum science at Beihang University."
url                      : "https://hanym-gif.github.io"
baseurl                  : "/hanym-gif"
repository               : "hanym-gif/hanym-gif"
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

# Author profile shown in the left sidebar
author:
  name             : "Yanmiao Han"
  avatar           : "Yanmiao-Han.png"
  bio              : "PhD student in theoretical and computational physics"
  location         : "Beijing, China"
  employer         : "School of Physics, Beihang University"
  email            : "ymhan@buaa.edu.cn"
  uri              :
  github           : "hanym-gif"
  googlescholar    : "https://scholar.google.com/citations?user=6bR6AfIAAAAJ&hl=en"
  orcid            : "https://orcid.org/0009-0008-9562-5287"
  researcherid     : "https://www.webofscience.com/wos/author/record/MTA-6093-2025"
  researchgate     :
  linkedin         :

# Publication headings
publication_category:
  manuscripts:
    title: "Journal Articles"
  preprints:
    title: "Preprints"

# Comments are disabled for a quiet academic site
comments:
  provider:

atom_feed:
  path:

# SEO and social sharing
google_site_verification:
bing_site_verification:
twitter:
  username:
social:
  type: "Person"
  name: "Yanmiao Han"
  links:
    - "https://github.com/hanym-gif"
    - "https://scholar.google.com/citations?user=6bR6AfIAAAAJ&hl=en"
    - "https://orcid.org/0009-0008-9562-5287"

analytics:
  provider: "custom"
  goatcounter:
    endpoint: "https://hanym-gif.goatcounter.com/count"

# Files included in the build
include:
  - .htaccess
  - _pages
  - files
exclude:
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - node_modules
  - package.json
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Markdown processing
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Content collections retained from AcademicPages
collections:
  publications:
    output: true
    permalink: /publication/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
